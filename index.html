<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chaves Habitar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2A483D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chaves">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=9">
</head>
<body>
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-caixa">
      <img class="login-logo" src="assets/logo.png" alt="Habitar Imóveis">
      <h1>Controle de chaves</h1>
      <label>Seu nome
        <select id="login-nome" required>
          <option value="">Carregando…</option>
        </select>
      </label>
      <label>PIN
        <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="current-password" required>
      </label>
      <button class="botao botao-login" type="submit">Entrar</button>
      <p id="login-aviso" class="login-aviso" hidden></p>
    </form>
  </main>

  <div id="tela-app" hidden>
    <header class="topo">
      <img class="topo-logo" src="assets/logo.png" alt="Habitar Imóveis">
      <nav class="abas" aria-label="Seções">
        <button class="aba" data-vista="chaves" type="button">Chaves</button>
        <button class="aba" data-vista="entregues" type="button">Entregues</button>
        <button class="aba" data-vista="historico" type="button">Histórico</button>
      </nav>
      <div class="topo-conta">
        <span id="topo-usuario"></span>
        <button id="botao-sair" type="button">Sair</button>
      </div>
    </header>

    <main class="conteudo">
      <section id="vista-chaves">
        <div class="barra">
          <div class="busca">
            <input id="busca" type="search" placeholder="Buscar chave" aria-label="Buscar por código, imóvel, endereço, bairro ou pessoa" autocomplete="off">
            <button id="botao-nova" class="botao botao-principal" type="button" data-acao="nova-chave">Nova chave</button>
          </div>
          <div id="filtros" class="filtros" role="group" aria-label="Filtrar por situação"></div>
        </div>
        <div id="lista-chaves" class="lista"></div>
      </section>

      <section id="vista-historico" hidden>
        <div class="barra">
          <div class="busca">
            <input id="busca-historico" type="search" placeholder="Buscar no histórico" aria-label="Buscar por chave, imóvel, pessoa, motivo ou data" autocomplete="off">
          </div>
          <div id="filtros-historico" class="filtros" role="group" aria-label="Filtrar por tipo"></div>
        </div>
        <div id="lista-historico" class="lista"></div>
      </section>
    </main>
  </div>

  <dialog id="janela" class="janela">
    <div class="janela-topo">
      <h2 id="janela-titulo"></h2>
      <button id="janela-fechar" class="janela-fechar" type="button" aria-label="Fechar">×</button>
    </div>
    <div id="janela-corpo" class="janela-corpo"></div>
  </dialog>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script src="config.js?v=9"></script>
  <script src="app.js?v=9"></script>
</body>
</html>
