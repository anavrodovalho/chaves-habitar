<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chaves Habitar</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#2A483D">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chaves">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/favicon-64.png">
  <link rel="apple-touch-icon" href="assets/icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital@1&family=Raleway:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="tela-login" class="login" hidden>
    <form id="form-login" class="login-caixa">
      <img class="login-logo" src="assets/logo.png" alt="Habitar Imóveis">
      <h1>Controle de chaves</h1>
      <p class="login-frase">Quem pegou, para onde foi e quando volta.</p>
      <label>Seu nome
        <select id="login-nome" required>
          <option value="">Carregando…</option>
        </select>
      </label>
      <label>PIN
        <input id="login-pin" type="password" inputmode="numeric" pattern="[0-9]*" minlength="4" maxlength="6" autocomplete="current-password" required>
      </label>
      <button class="botao botao-principal" type="submit">Entrar</button>
      <p id="login-aviso" class="login-aviso" hidden></p>
    </form>
  </main>

  <div id="tela-app" hidden>
    <header class="topo">
      <img class="topo-logo" src="assets/logo.png" alt="Habitar Imóveis">
      <div class="topo-texto">
        <strong id="topo-titulo">Chaves</strong>
        <span id="topo-usuario"></span>
      </div>
      <nav class="abas" aria-label="Seções">
        <button class="aba" data-vista="painel" type="button">Painel</button>
        <button class="aba" data-vista="historico" type="button">Histórico</button>
        <button class="aba" data-vista="admin" type="button" hidden>Admin</button>
      </nav>
      <button id="botao-sair" class="topo-sair" type="button">Sair</button>
    </header>

    <main class="conteudo">
      <section id="vista-painel">
        <div id="cartoes" class="cartoes"></div>
        <div class="busca">
          <input id="busca" type="search" placeholder="Código, imóvel, endereço ou bairro" aria-label="Buscar chave" autocomplete="off">
        </div>
        <div id="filtros" class="filtros" role="group" aria-label="Filtrar por situação"></div>
        <div id="lista-chaves" class="lista"></div>
      </section>

      <section id="vista-historico" hidden>
        <form id="form-historico" class="filtro-historico">
          <label>Chave
            <select id="hist-chave"><option value="">Todas</option></select>
          </label>
          <label>Tipo
            <select id="hist-tipo">
              <option value="">Todos</option>
              <option>Saída</option>
              <option>Entrada</option>
            </select>
          </label>
          <label class="largo">Responsável
            <select id="hist-responsavel"><option value="">Todos</option></select>
          </label>
          <label>De
            <input id="hist-inicio" type="date">
          </label>
          <label>Até
            <input id="hist-fim" type="date">
          </label>
        </form>
        <div id="lista-historico" class="lista"></div>
      </section>

      <section id="vista-admin" hidden>
        <button id="botao-nova-chave" class="botao botao-principal" type="button">Cadastrar nova chave</button>
        <h2 class="titulo-secao">Chaves cadastradas</h2>
        <div id="lista-admin" class="lista-admin"></div>
      </section>
    </main>
  </div>

  <dialog id="janela" class="janela">
    <div class="janela-topo">
      <h2 id="janela-titulo"></h2>
      <button id="janela-fechar" class="janela-fechar" type="button" aria-label="Fechar">×</button>
    </div>
    <div id="janela-corpo" class="janela-corpo"></div>
  </dialog>

  <div id="avisos" class="avisos" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
